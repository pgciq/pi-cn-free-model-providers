name: opencode-zen-model-watch

# OpenCode Zen 的 /v1/models 不提供可靠的价格字段，匿名 chat 探测的 403
# 也不能证明模型已转付费（FreeTierError 可能只是缺少官方客户端上下文）。
# 本巡检以 Console /api/config 中的 model.cost 为价格权威：input/output
# 全部为 0 才算免费；目录消失仍作为下线/改名信号。该接口需要仓库 secret
# OPENCODE_API_KEY，不能再用匿名 403 做有效性判断。

on:
  schedule:
    - cron: "17 1 * * *" # 每日 01:17 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract curated OpenCode Zen model ids
        run: |
          set -euo pipefail
          awk '
            /^const ZEN_FREE_MODELS = \[\];/ { exit }
            /^const ZEN_FREE_MODELS/ { in_block=1; next }
            in_block && /^\];/ { exit }
            in_block { print }
          ' pi-cn-free-model-providers-ext.mjs \
            | grep -o 'id: "[^"]*"' | cut -d'"' -f2 > /tmp/curated.txt || :
          echo "在册模型 $(wc -l < /tmp/curated.txt) 个:"
          if [ -s /tmp/curated.txt ]; then
            cat /tmp/curated.txt
          else
            echo "当前没有已验证的静态 Zen 免费模型，改由运行时自动发现"
          fi

      - name: Fetch live model catalog
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 \
            -H "User-Agent: opencode/1.15.5" \
            -H "x-opencode-client: cli" \
            -H "Authorization: Bearer public" \
            "https://opencode.ai/zen/v1/models" -o /tmp/models.json
          jq -r '.data[]?.id // empty' /tmp/models.json | sort -u > /tmp/live.txt
          test -s /tmp/live.txt
          echo "在线目录 $(wc -l < /tmp/live.txt) 个模型"

      - name: Fetch Console pricing catalog
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_API_KEY" || { echo '缺少 repository secret OPENCODE_API_KEY' >&2; exit 1; }
          curl -fsSL --max-time 30 \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            "https://opencode.ai/console/api/config" -o /tmp/config.json
          jq -e '.config.provider.opencode.models | type == "object"' /tmp/config.json >/dev/null
          jq -r '.config.provider.opencode.models | to_entries[] | select((.value.cost.input // 0 | tonumber) == 0 and (.value.cost.output // 0 | tonumber) == 0) | .key' /tmp/config.json | sort -u > /tmp/free-by-price.txt
          test -s /tmp/free-by-price.txt

      - name: Check disappearance and Console price
        id: detect
        run: |
          set -euo pipefail
          : > /tmp/anomalies.txt
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if ! grep -qxF -- "$id" /tmp/live.txt; then
              printf '%s\t从 /v1/models 消失（疑似下线或改名）\n' "$id" >> /tmp/anomalies.txt
              continue
            fi

            if ! grep -qxF -- "$id" /tmp/free-by-price.txt; then
              printf '%s\tConsole cost 非 0（免费档撤销或价格变更）\n' "$id" >> /tmp/anomalies.txt
            else
              echo "$id -> FREE（Console cost=0）"
            fi
          done < /tmp/curated.txt
          echo "anomalies=$(grep -c . /tmp/anomalies.txt || true)" >> "$GITHUB_OUTPUT"
          echo "--- 异常 ---"
          cat /tmp/anomalies.txt || true

      - name: Open or update maintenance issue
        if: steps.detect.outputs.anomalies != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="⚠️ OpenCode Zen 免费模型目录漂移"
          {
            printf 'OpenCode Zen 免费模型巡检发现异常（%s）。\n\n' "$(date +%F)"
            printf '| 模型 | 异常 |\n|---|---|\n'
            while IFS="$(printf '\t')" read -r id msg; do
              printf '| `%s` | %s |\n' "$id" "$msg"
            done < /tmp/anomalies.txt
            printf '\n运行时扩展会在启动后自动剔除下线或转付费模型；请确认后同步 `ZEN_FREE_MODELS`、README 和版本发布。\n'
            printf '\n参考：\n- 目录：https://opencode.ai/zen/v1/models\n- 更新位置：`pi-cn-free-model-providers-ext.mjs`、README OpenCode Zen 小节\n'
          } > /tmp/body.md
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | head -1 || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/body.md
            echo "已更新现有 issue #$existing"
          else
            gh issue create --title "$title" --body-file /tmp/body.md
          fi
