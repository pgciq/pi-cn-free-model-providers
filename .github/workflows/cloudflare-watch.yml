name: cloudflare-model-watch

# Cloudflare Workers AI 按全局 Neurons 额度计费，不存在单模型"免费转付费"，
# 主要变动模式是模型下线/改名（弃用会先在文档标注日期，最终从目录移除）。
# 官方模型目录页公开免鉴权，直接与扩展内 CLOUDFLARE_MODELS 精确比对：
# 在册模型从目录消失即失效（运行时 filterToLive 对 Cloudflare 不生效 ——
# 其 /v1/models 端点按账号鉴权，匿名无法调用，故只能靠本工作流兜底）。
# 数据源：https://developers.cloudflare.com/workers-ai/models/ （公开、无需鉴权）
# 另含新模型发现：官方定价页（platform/pricing/index.md，公开免鉴权）按模型列出 Neurons 单价，
# 新模型上架即出现在表中；对新条目按 10,000 Neurons/天免费额度换算日输出预算并分级提示
# （对标 gpt-oss-120b ≈147K tokens/天），免费档新模型上线即被发现与评估；
# 基线存 watch-state/ 由 workflow 自动提交。

on:
  schedule:
    - cron: "47 3 * * 1" # 每周一 03:47 UTC（错开 siliconflow watch 的 03:23）
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch official Workers AI model catalog
        run: |
          curl -fsSL --max-time 60 \
            "https://developers.cloudflare.com/workers-ai/models/" \
            -o /tmp/catalog.html
          wc -c /tmp/catalog.html

      - name: Extract official catalog ids and curated ids
        run: |
          grep -o '@cf/[A-Za-z0-9._/-]*' /tmp/catalog.html \
            | sed -E 's|[/._-]+$||' | sort -u > /tmp/live.txt
          echo "官方目录 $(wc -l < /tmp/live.txt) 个模型"
          awk '/^const CLOUDFLARE_MODELS/,/^\];/' pi-cn-free-model-providers-ext.mjs \
            | grep -o 'id: "[^"]*"' | cut -d'"' -f2 > /tmp/curated.txt
          echo "在册模型 $(wc -l < /tmp/curated.txt) 个:"
          cat /tmp/curated.txt

      - name: Detect curated models missing from official catalog
        id: detect
        run: |
          : > /tmp/gone.txt
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            grep -qxF -- "$id" /tmp/live.txt || printf '%s\n' "$id" >> /tmp/gone.txt
          done < /tmp/curated.txt
          count=$(grep -c . /tmp/gone.txt || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "从官方目录消失的在册模型 $count 个:"
          cat /tmp/gone.txt

      - name: Discover newly priced models and estimate free-tier budget
        id: discover
        run: |
          curl -fsSL --max-time 60 "https://developers.cloudflare.com/workers-ai/platform/pricing/index.md" -o /tmp/pricing.md
          grep '^| @cf/' /tmp/pricing.md | cut -d'|' -f2 | awk '{print $1}' | sort -u > /tmp/live_pricing.txt
          total=$(grep -c . /tmp/live_pricing.txt || true)
          echo "定价表模型 ${total:-0} 个"
          : > /tmp/discovered.txt
          if [ "${total:-0}" = "0" ]; then
            echo "_catalog 定价页结构变更：未解析到任何 @cf/ 模型行，请人工核验" >> /tmp/discovered.txt
          else
            comm -13 .github/watch-state/cloudflare-known-pricing.txt /tmp/live_pricing.txt > /tmp/new_models.txt || :
            while IFS= read -r mid; do
              [ -z "$mid" ] && continue
              out=$(grep -F "| ${mid} " /tmp/pricing.md | grep -oE "[0-9]+ neurons per M output tokens" | head -1 | grep -oE "^[0-9]+" || :)
              if [ -n "$out" ] && [ "$out" -gt 0 ]; then
                kbudget=$((10000000 / out))
                if [ "$kbudget" -ge 100 ]; then tag="免费档实用，优先评估"; elif [ "$kbudget" -ge 30 ]; then tag="可用但偏耗额度"; else tag="额度杀手，谨慎收录"; fi
                echo "新模型 ${mid}：输出单价 ${out} neurons/M → 免费档日输出约 ${kbudget}K tokens（${tag}）" >> /tmp/discovered.txt
              else
                echo "新模型 ${mid}：非 token 计价或行结构变化，请人工核验免费可用性" >> /tmp/discovered.txt
              fi
            done < /tmp/new_models.txt
            sort -u .github/watch-state/cloudflare-known-pricing.txt /tmp/live_pricing.txt > /tmp/merged.txt
            mv /tmp/merged.txt .github/watch-state/cloudflare-known-pricing.txt
          fi
          disc=$(grep -c . /tmp/discovered.txt || true)
          echo "新发现 ${disc:-0} 条"
          cat /tmp/discovered.txt
          echo "new=${disc:-0}" >> "$GITHUB_OUTPUT"
          if [ "${disc:-0}" != "0" ]; then
            echo "changed=1" > /tmp/state_changed.env
          fi

      - name: Open issue on catalog changes
        if: steps.detect.outputs.count != '0' || steps.discover.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gone="${{ steps.detect.outputs.count }}"
          disc=$(grep -c . /tmp/discovered.txt 2>/dev/null || true)
          {
            echo "Cloudflare Workers AI 目录巡检结果（$(date +%F)）。"
            echo ""
            if [ "${gone:-0}" != "0" ]; then
              echo "## 在册模型从官方目录消失（下线或改名，请核验更新）"
              echo ""
              echo '```'
              cat /tmp/gone.txt
              echo '```'
              echo ""
            fi
            if [ "${disc:-0}" != "0" ]; then
              echo "## 新上架模型（按免费额度换算）"
              echo ""
              while IFS= read -r ln; do
                echo "* $ln"
              done < /tmp/discovered.txt
              echo ""
              echo "判定基准：Workers Free 共享 10,000 Neurons/天；对标 gpt-oss-120b 输出 68182 neurons/M ≈ 147K tokens/天。"
              echo ""
            fi
            echo "参考："
            echo "- 官方目录: https://developers.cloudflare.com/workers-ai/models/"
            echo "- 定价页: https://developers.cloudflare.com/workers-ai/platform/pricing/"
            echo "- 平台变更公告: https://developers.cloudflare.com/changelog/"
            echo "- 更新位置: CLOUDFLARE_MODELS（pi-cn-free-model-providers-ext.mjs）、README Cloudflare 小节对应表格与兼容性矩阵"
          } > /tmp/body.md
          gh issue create --title "⚠️ Cloudflare 模型目录变动 ($(date +%F))" --body-file /tmp/body.md

      - name: Commit refreshed baselines
        if: always()
        run: |
          if [ ! -f /tmp/state_changed.env ]; then
            echo "基线无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/watch-state/
          git commit -m "chore(watch): refresh cloudflare pricing baseline (auto)" || exit 0
          git push || echo "推送失败（分支保护？），基线已保留在运行日志中"
