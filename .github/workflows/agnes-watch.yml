name: agnes-model-watch

# Agnes AI 的失效模式与检测通道（2026-08 实测确认）：
#   1) /v1/models 需要鉴权（匿名 401），无 key 用户运行时 filterToLive 失效；
#   2) Flash 系为"限时免费"，最大风险是静默转付费 —— 运行时与目录比对均无法感知；
#   3) 官方文档站提供匿名 Markdown 原文（Mintlify .md 后缀），单模型页的
#      「限制与价格」表格含「标准价格 / 当前价格」两列，免费时当前价格为 $0。
# 本 watcher 四层检测（全部匿名，无需密钥）：
#   a) 在册模型文档缺失 = 疑似下线/改名（slug 为 ID 去点号；服务端偶发回退
#      SPA 页面，以 <!DOCTYPE html 识别并重试一次）；
#   b) *flash* 模型「当前价格」非 $0 = 免费档撤销；pro 系仅核对页面存在；
#   c) 参数指纹（上下文窗口/最大输出/价格行哈希）对比 .github/watch-state/
#      agnes-fingerprints.txt 基线 —— 检测原位升级或计费调整；
#   d) llms.txt 全目录 vs watch-state/agnes-known-slugs.txt —— 发现新 slug
#      （新版本发布 / 改名后的新名字）提示评估收录。
# tokenplan.md 仅追踪生效日期变化（配额表只列订阅计划覆盖的模型，与模型是否
# 在服无关 —— 逐模型存在性检查会误报，2026-08 实证后移除）；下线/转付费
# 信号由文档页存在性与价格指纹两层承担。基线变更由 workflow 自动提交。

on:
  schedule:
    - cron: "35 4 * * 1" # 每周一 04:35 UTC（错开 siliconflow 03:23 / cloudflare 03:47 / nvidia 04:11）
  workflow_dispatch: {}

permissions:
  issues: write
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract curated agnes model ids
        run: |
          awk '/^const AGNES_MODELS/,/^\];/' pi-cn-free-model-providers-ext.mjs \
            | grep -o 'id: "[^"]*"' | cut -d'"' -f2 > /tmp/curated.txt
          echo "在册模型 $(wc -l < /tmp/curated.txt) 个:"
          cat /tmp/curated.txt

      - name: Doc presence, free-tier pricing, param fingerprint per model
        run: |
          : > /tmp/anomalies.txt
          cp .github/watch-state/agnes-fingerprints.txt /tmp/fp_base.txt
          : > /tmp/fp_new.txt
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            slug=${id//./}
            ok=""
            for attempt in 1 2; do
              curl -s -m 40 -L -H "User-Agent: Mozilla/5.0" \
                "https://www.agnes-ai.com/zh-Hans/docs/${slug}.md" -o /tmp/doc.md
              if [ -s /tmp/doc.md ] && ! head -c 200 /tmp/doc.md | grep -q "<!DOCTYPE html"; then
                ok=1
                break
              fi
              sleep 6
            done
            if [ -z "$ok" ]; then
              printf '%s\t文档页缺失（疑似下线或改名）\n' "$id" >> /tmp/anomalies.txt
              continue
            fi
            new_fp=$(grep -E '上下文窗口|最大输出|标准价格|当前价格' /tmp/doc.md \
              | sed 's/[[:space:]]*//g' | sort | sha256sum | cut -d' ' -f1 || echo '')
            old_fp=$(grep -m1 "^${id} " /tmp/fp_base.txt 2>/dev/null | awk '{print $2}' || echo '')
            echo "$id $new_fp" >> /tmp/fp_new.txt
            if [ -n "$old_fp" ] && [ "$old_fp" != "$new_fp" ]; then
              printf '%s\t参数指纹变化（疑似原位升级或计费调整，请人工核验文档）\n' "$id" >> /tmp/anomalies.txt
            fi
            case "$id" in
              *flash*)
                prices=$(grep -E '^\| (输入|输出) Token' /tmp/doc.md \
                  | awk -F'|' '{print $4}' | grep -o '\$[0-9.]*' || true)
                if [ -z "$prices" ]; then
                  printf '%s\t价格表缺失（文档结构变更，请人工核验）\n' "$id" >> /tmp/anomalies.txt
                elif echo "$prices" | grep -qv '^\$0$'; then
                  printf '%s\t免费档撤销：当前价格变为 %s\n' "$id" "$(echo "$prices" | tr '\n' ' ')" >> /tmp/anomalies.txt
                else
                  echo "$id -> OK（当前价格 \$0，免费有效）"
                fi
                ;;
              *)
                echo "$id -> OK（付费模型，仅核对页面存在与指纹）"
                ;;
            esac
            sleep 1
          done < /tmp/curated.txt
          sort /tmp/fp_new.txt > /tmp/fp_new_sorted.txt
          if ! diff -q /tmp/fp_new_sorted.txt .github/watch-state/agnes-fingerprints.txt >/dev/null 2>&1; then
            echo "changed=1" > /tmp/state_changed.env
          fi
          cp /tmp/fp_new_sorted.txt .github/watch-state/agnes-fingerprints.txt
          echo "--- 异常 $(grep -c . /tmp/anomalies.txt || true) 个 ---"
          cat /tmp/anomalies.txt

      - name: Discover new models via llms.txt catalog
        run: |
          for attempt in 1 2; do
            curl -s -m 40 -L -H "User-Agent: Mozilla/5.0" \
              "https://wiki.agnes-ai.com/llms.txt" -o /tmp/llms.txt
            [ -s /tmp/llms.txt ] && break
            sleep 6
          done
          grep -o '/docs/agnes-[0-9a-z-]*\.md' /tmp/llms.txt \
            | sed 's|/docs/||;s|\.md||' | sort -u > /tmp/live_slugs.txt
          comm -13 .github/watch-state/agnes-known-slugs.txt /tmp/live_slugs.txt > /tmp/new_slugs.txt
          n=$(grep -c . /tmp/new_slugs.txt || true)
          echo "目录新增 slug $n 个:"
          cat /tmp/new_slugs.txt
          if [ "${n:-0}" != "0" ]; then
            while IFS= read -r s; do
              printf '_catalog\t发现未收录的新模型文档: %s（可能是升级版或改名后新名，请评估是否收录）\n' "$s" >> /tmp/anomalies.txt
            done < /tmp/new_slugs.txt
            sort -u /tmp/live_slugs.txt .github/watch-state/agnes-known-slugs.txt > /tmp/merged.txt
            mv /tmp/merged.txt .github/watch-state/agnes-known-slugs.txt
            echo "changed=1" >> /tmp/state_changed.env
          fi

      - name: Cross-check tokenplan quota reference
        run: |
          tp_ok=""
          for attempt in 1 2; do
            curl -s -m 40 -L -H "User-Agent: Mozilla/5.0" \
              "https://www.agnes-ai.com/zh-Hans/docs/tokenplan.md" -o /tmp/tokenplan.md
            if [ -s /tmp/tokenplan.md ] && ! head -c 200 /tmp/tokenplan.md | grep -q "<!DOCTYPE html"; then
              tp_ok=1
              break
            fi
            sleep 6
          done
          if [ -z "$tp_ok" ]; then
            echo "tokenplan.md 拉取失败（不影响其余检测结果）"
            exit 0
          fi
          date_line=$(grep -m1 '生效日期' /tmp/tokenplan.md || echo '生效日期：未知')
          echo "配额文档 $date_line"
          new_date=$(echo "$date_line" | sed 's/[^0-9-]//g')
          old_date=$(grep -m1 '^_tokenplan_date ' .github/watch-state/agnes-fingerprints.txt 2>/dev/null | awk '{print $2}')
          if [ -n "$old_date" ] && [ "$new_date" != "$old_date" ]; then
            printf '_tokenplan\t配额文档生效日期变更：%s -> %s\n' "$old_date" "$new_date" >> /tmp/anomalies.txt
          fi
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            case "$id" in
              *flash*)
                grep -q -- "$id" /tmp/tokenplan.md || \
                  printf '%s\t已从 Token Plan 配额文档消失\n' "$id" >> /tmp/anomalies.txt
                ;;
            esac
          done < /tmp/curated.txt
          grep -v '^_tokenplan_date ' .github/watch-state/agnes-fingerprints.txt > /tmp/fp_keep.txt 2>/dev/null || : 
          printf '_tokenplan_date %s\n' "$new_date" >> /tmp/fp_keep.txt
          sort /tmp/fp_keep.txt > .github/watch-state/agnes-fingerprints.txt
          echo "changed=1" >> /tmp/state_changed.env

      - name: Commit refreshed baselines
        if: always()
        run: |
          if [ ! -f /tmp/state_changed.env ]; then
            echo "基线无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/watch-state/
          git commit -m "chore(watch): refresh agnes baselines (auto)" || exit 0
          git push || echo "推送失败（分支保护？），基线已保留在 issue 运行日志中"

      - name: Open issue when anomalies found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(grep -c . /tmp/anomalies.txt 2>/dev/null || true)
          if [ "${n:-0}" = "0" ]; then
            echo "全部正常，无需开 issue"
            exit 0
          fi
          {
            printf '周期巡检发现 Agnes AI 在册模型异常（%s）。\n\n' "$(date +%F)"
            printf '| 模型 | 异常 |\n|---|---|\n'
            while IFS="$(printf '\t')" read -r id msg; do
              printf '| `%s` | %s |\n' "$id" "$msg"
            done < /tmp/anomalies.txt
            printf '\n参考：\n'
            printf -- '- 价格信号源: 各模型文档页 .md 的「限制与价格 / 当前价格」（$0 即免费有效）\n'
            printf -- '- 配额参考: https://www.agnes-ai.com/zh-Hans/docs/tokenplan\n'
            printf -- '- 全目录索引: https://wiki.agnes-ai.com/llms.txt\n'
            printf -- '- 更新位置: `AGNES_MODELS`（pi-cn-free-model-providers-ext.mjs）、README Agnes 小节、模型对比表、场景矩阵\n'
          } > /tmp/body.md
          gh issue create \
            --title "⚠️ Agnes 在册模型巡检异常 ($(date +%F))" \
            --body-file /tmp/body.md
