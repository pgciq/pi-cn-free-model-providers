name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish pi-cn-free-model-providers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "pi-cn-free-model-providers"
          node --check pi-cn-free-model-providers-ext.mjs
          npm pack --dry-run

      - name: Enable npm Trusted Publisher support
        run: npm install --global npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance
